name: Deploy Pages

# Renderiza el sitio de estudio (portada + 31 laboratorios con navegación
# anterior/siguiente) a partir del Markdown del repositorio y lo publica en
# GitHub Pages. La fuente única es labs/ y advanced_labs/: si se corrige un
# laboratorio, el sitio se regenera aquí.

on:
  push:
    branches: ["main"]
    paths:
      - "labs/**"
      - "advanced_labs/**"
      - "scripts/generate_site.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Generar sitio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: python -m pip install --quiet "markdown>=3.6"
      - name: Generar HTML del sitio
        run: python scripts/generate_site.py
      - name: Comprobar que el sitio salió completo
        run: |
          set -euo pipefail
          # Un sitio a medias se publica igual de bien que uno completo, así que
          # conviene mirar antes de subirlo.
          [ -s site/index.html ] || { echo "::error::falta site/index.html"; exit 1; }
          [ -s site/styles.css ] || { echo "::error::falta site/styles.css"; exit 1; }
          paginas=$(find site -name '*.html' | wc -l)
          echo "Páginas HTML: $paginas"
          [ "$paginas" -ge 32 ] || { echo "::error::solo $paginas páginas, esperaba 32 (31 labs + portada)"; exit 1; }
          {
            echo "### 🌐 Sitio generado"
            echo ""
            echo "- Páginas HTML: **$paginas**"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Publicar
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
