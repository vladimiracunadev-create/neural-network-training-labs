name: Notebook and assessment contracts

on:
  pull_request:
    paths:
      - 'labs/**'
      - 'advanced_labs/**'
      - 'assignments/**'
      - 'src/**'
      - 'configs/**'
      - 'nbgrader_config.py'
      - 'scripts/generate_specialized_notebooks.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev,notebooks,education]'
      - run: neural-labs validate --warnings-as-errors
      - run: python scripts/validate_repository.py
      - run: pytest tests/test_repository_structure.py tests/test_schema_v2.py tests/test_notebook_specialization_v3.py -q
      - name: Validate nbgrader metadata
        run: python scripts/validate_nbgrader.py
