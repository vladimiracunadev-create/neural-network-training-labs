name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: markdownlint-cli2
        run: npx --yes markdownlint-cli2 "**/*.md"

  study-surfaces:
    name: Navegación y páginas de estudio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --quiet "markdown>=3.6" "PyYAML>=6"
      # La ficha y la navegación del Markdown, y las páginas HTML versionadas,
      # se generan desde el mismo Markdown: si alguien edita una sin regenerar la
      # otra, las superficies se desincronizan y este paso lo detiene.
      - name: Markdown de los laboratorios al día
        run: python scripts/build_lab_docs.py --check
      - name: Páginas HTML de los laboratorios al día
        run: python scripts/generate_lab_html.py --check
      - name: El sitio de Pages se genera sin errores
        run: python scripts/generate_site.py

  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev,notebooks,serving]'
      - run: python -m compileall -q src labs scripts tests
      - run: neural-labs validate --warnings-as-errors
      - run: python scripts/validate_repository.py
      - run: python -m ruff check src scripts tests
      - run: pytest -m 'not network and not slow' --cov=neural_labs --cov-report=xml --cov-report=term-missing -q
      - uses: actions/upload-artifact@v4
        if: always() && matrix.python-version == '3.12'
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

  package:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
