name: Security and supply chain

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  schedule:
    - cron: '15 7 * * 3'
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'src/**'
      - 'deploy/**'

permissions:
  contents: read

jobs:
  secretos:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Instalar gitleaks
        env:
          GITLEAKS_VERSION: "8.18.4"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Detectar secretos
        run: gitleaks detect --no-git --redact -v --source . --config .gitleaks.toml

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[security]'
      - run: bandit -c pyproject.toml -r src
      - run: pip-audit
      - run: neural-labs supply-chain --output-dir dist/security
      - uses: actions/upload-artifact@v4
        with:
          name: supply-chain-evidence
          path: dist/security
