schema_version: '3.0'
title: Activaciones y funciones de pérdida
level: fundamentos
estimated_hours: 4
prerequisites:
- Python básico
- NumPy
- álgebra lineal elemental
learning_outcomes:
- Comparar ReLU, GELU, Tanh y pérdidas apropiadas en clases desbalanceadas.
- Preparar y auditar el dataset real wine_quality sin fuga de datos.
- Entrenar y evaluar comparación controlada de activaciones y pérdidas.
- 'Comparar contra la línea base: Regresión ordinal y Random Forest.'
- Interpretar intervalos de confianza, errores y limitaciones.
deliverables:
- notebook ejecutado
- reporte experimental
- model card
- comparación con línea base
- respuesta a preguntas críticas
success_criteria:
- cero solapamiento entre train, validation y test
- selección basada únicamente en validation
- métricas finales acompañadas por incertidumbre
- conclusiones que distinguen evidencia de suposición
dataset:
  name: wine_quality
  source: UCI
  reference: https://archive.ics.uci.edu/dataset/186/wine+quality
  license: CC BY 4.0
id: 17_activations_and_losses
class_number: 18
module_number: 5
module_title: Mecánica fina
essential_question: ¿Cómo cambia lo que aprende una red al cambiar activación o pérdida?
opening_hook: Dos modelos idénticos pueden reaccionar de manera opuesta al mismo ejemplo difícil si sus pérdidas asignan costos distintos.
class_practice: Comparar funciones y derivadas, provocar saturación y relacionar pérdidas con desbalance y costos de error.
visual_evidence:
  title: La forma de la función dirige el aprendizaje
  asset: assets/class-map.svg
  steps:
  - Señal de entrada
  - Activación o pérdida
  - Gradiente resultante
common_misconception: Elegir una pérdida es una decisión sobre qué errores importan, no un detalle intercambiable de implementación.
