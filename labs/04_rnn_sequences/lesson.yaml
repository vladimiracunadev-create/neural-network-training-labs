schema_version: '3.0'
title: RNN para texto
level: intermedio
estimated_hours: 6
prerequisites:
- PyTorch básico
- particiones train/validation/test
- métricas de evaluación
learning_outcomes:
- Clasificar sentimiento en reseñas reales usando embeddings y recurrencia.
- Preparar y auditar el dataset real imdb sin fuga de datos.
- Entrenar y evaluar recurrencia sobre secuencias tokenizadas.
- 'Comparar contra la línea base: TF-IDF + regresión logística.'
- Interpretar intervalos de confianza, errores y limitaciones.
deliverables:
- notebook ejecutado
- reporte experimental
- model card
- comparación con línea base
- respuesta a preguntas críticas
success_criteria:
- cero solapamiento entre train, validation y test
- selección basada únicamente en validation
- métricas finales acompañadas por incertidumbre
- conclusiones que distinguen evidencia de suposición
dataset:
  name: imdb
  source: Hugging Face / Stanford
  reference: https://huggingface.co/datasets/stanfordnlp/imdb
  license: Consultar dataset card
id: 04_rnn_sequences
class_number: 5
module_number: 2
module_title: Arquitecturas
essential_question: ¿Cuánta información del comienzo de una secuencia llega realmente al final?
opening_hook: Al leer una reseña, una negación temprana puede cambiar el sentido de una frase mucho después. La RNN intenta conservar ese contexto paso a paso.
class_practice: Seguir el estado oculto, comparar longitudes y observar cómo el gradiente se debilita o explota con la distancia.
visual_evidence:
  title: Memoria y pérdida de señal en una RNN
  asset: assets/class-map.svg
  steps:
  - Token actual
  - Estado recurrente
  - Decisión final
common_misconception: El último estado no contiene necesariamente toda la secuencia; la información puede degradarse mucho antes de llegar a él.
