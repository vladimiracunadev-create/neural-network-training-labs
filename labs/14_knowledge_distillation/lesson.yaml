schema_version: '3.0'
title: Destilación de conocimiento
level: avanzado
estimated_hours: 8
prerequisites:
- PyTorch intermedio
- optimización
- lectura de artículos técnicos
learning_outcomes:
- Transferir conocimiento de una CNN profesora a una estudiante compacta.
- Preparar y auditar el dataset real cifar10 sin fuga de datos.
- Entrenar y evaluar transferencia de conocimiento profesor-estudiante.
- 'Comparar contra la línea base: Estudiante entrenado solo con etiquetas.'
- Interpretar intervalos de confianza, errores y limitaciones.
deliverables:
- notebook ejecutado
- reporte experimental
- model card
- comparación con línea base
- respuesta a preguntas críticas
success_criteria:
- cero solapamiento entre train, validation y test
- selección basada únicamente en validation
- métricas finales acompañadas por incertidumbre
- conclusiones que distinguen evidencia de suposición
dataset:
  name: cifar10
  source: Torchvision / University of Toronto
  reference: https://www.cs.toronto.edu/~kriz/cifar.html
  license: Consultar términos CIFAR-10
id: 14_knowledge_distillation
class_number: 15
module_number: 4
module_title: Entrenamiento eficiente
essential_question: ¿Qué información transmiten las probabilidades suaves que una etiqueta dura no contiene?
opening_hook: La profesora no solo dice «gato»; también muestra cuánto se parece la imagen a otras clases. Esa estructura guía a la estudiante compacta.
class_practice: Variar temperatura y mezcla de pérdidas y construir el frente precisión–latencia–tamaño.
visual_evidence:
  title: Transferir relaciones, no copiar respuestas
  asset: assets/class-map.svg
  steps:
  - Logits de profesora
  - Objetivos suaves
  - Estudiante compacta
common_misconception: Una estudiante más pequeña no hereda automáticamente la calidad de la profesora; capacidad y temperatura limitan la transferencia.
