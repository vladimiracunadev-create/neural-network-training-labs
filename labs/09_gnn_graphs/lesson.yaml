schema_version: '3.0'
title: GNN sobre red de citas
level: avanzado
estimated_hours: 8
prerequisites:
- PyTorch intermedio
- optimización
- lectura de artículos técnicos
learning_outcomes:
- Clasificar publicaciones científicas usando texto y enlaces de citas.
- Preparar y auditar el dataset real cora sin fuga de datos.
- Entrenar y evaluar propagación de mensajes sobre grafos.
- 'Comparar contra la línea base: MLP sin aristas.'
- Interpretar intervalos de confianza, errores y limitaciones.
deliverables:
- notebook ejecutado
- reporte experimental
- model card
- comparación con línea base
- respuesta a preguntas críticas
success_criteria:
- cero solapamiento entre train, validation y test
- selección basada únicamente en validation
- métricas finales acompañadas por incertidumbre
- conclusiones que distinguen evidencia de suposición
dataset:
  name: cora
  source: PyTorch Geometric / Planetoid
  reference: https://pytorch-geometric.readthedocs.io/en/stable/generated/torch_geometric.datasets.Planetoid.html
  license: Consultar dataset original
id: 09_gnn_graphs
class_number: 10
module_number: 3
module_title: Familias especializadas
essential_question: ¿Cuánto aporta conocer las conexiones además de conocer cada nodo?
opening_hook: Dos artículos con vocabularios ambiguos pueden aclararse al observar qué trabajos citan y quiénes los citan.
class_practice: Visualizar vecindarios, retirar aristas y comparar una GNN con una MLP que solo ve atributos.
visual_evidence:
  title: Aprender haciendo circular mensajes
  asset: assets/class-map.svg
  steps:
  - Nodo y atributos
  - Vecinos envían mensajes
  - Representación agregada
common_misconception: Añadir más capas no siempre incorpora mejor contexto; puede volver indistinguibles las representaciones de los nodos.
