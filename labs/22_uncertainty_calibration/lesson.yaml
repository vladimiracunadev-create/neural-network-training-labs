schema_version: '3.0'
title: Incertidumbre y calibración
level: avanzado
estimated_hours: 8
prerequisites:
- PyTorch intermedio
- optimización
- lectura de artículos técnicos
learning_outcomes:
- Medir confianza, Brier score, ECE y temperature scaling.
- Preparar y auditar el dataset real breast_cancer_wisconsin sin fuga de datos.
- Entrenar y evaluar calibración probabilística.
- 'Comparar contra la línea base: Regresión logística calibrada.'
- Interpretar intervalos de confianza, errores y limitaciones.
deliverables:
- notebook ejecutado
- reporte experimental
- model card
- comparación con línea base
- respuesta a preguntas críticas
success_criteria:
- cero solapamiento entre train, validation y test
- selección basada únicamente en validation
- métricas finales acompañadas por incertidumbre
- conclusiones que distinguen evidencia de suposición
dataset:
  name: breast_cancer_wisconsin
  source: UCI
  reference: https://archive.ics.uci.edu/dataset/17/breast+cancer+wisconsin+diagnostic
  license: CC BY 4.0
id: 22_uncertainty_calibration
class_number: 23
module_number: 6
module_title: Confianza y despliegue
essential_question: ¿Qué significa realmente que un modelo anuncie 80 % de confianza?
opening_hook: Entre muchas predicciones hechas con 80 % de confianza, aproximadamente ocho de cada diez deberían acertar. Esa promesa se puede medir.
class_practice: Construir un diagrama de confiabilidad, calcular ECE y aplicar temperature scaling sin tocar test.
visual_evidence:
  title: Hacer que confianza y frecuencia coincidan
  asset: assets/class-map.svg
  steps:
  - Confianza declarada
  - Frecuencia observada
  - Recalibración
common_misconception: Una alta exactitud no implica probabilidades bien calibradas; son propiedades diferentes.
