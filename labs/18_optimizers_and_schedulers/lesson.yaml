schema_version: '3.0'
title: Optimizadores y schedulers
level: fundamentos
estimated_hours: 4
prerequisites:
- Python básico
- NumPy
- álgebra lineal elemental
learning_outcomes:
- Comparar SGD, Momentum, Adam y reducción de tasa de aprendizaje.
- Preparar y auditar el dataset real california_housing sin fuga de datos.
- Entrenar y evaluar comparación controlada de optimizadores y schedulers.
- 'Comparar contra la línea base: Media y Ridge.'
- Interpretar intervalos de confianza, errores y limitaciones.
deliverables:
- notebook ejecutado
- reporte experimental
- model card
- comparación con línea base
- respuesta a preguntas críticas
success_criteria:
- cero solapamiento entre train, validation y test
- selección basada únicamente en validation
- métricas finales acompañadas por incertidumbre
- conclusiones que distinguen evidencia de suposición
dataset:
  name: california_housing
  source: scikit-learn / StatLib
  reference: https://scikit-learn.org/stable/modules/generated/sklearn.datasets.fetch_california_housing.html
  license: Consultar fuente StatLib
id: 18_optimizers_and_schedulers
class_number: 19
module_number: 5
module_title: Mecánica fina
essential_question: ¿Por qué distintos optimizadores recorren caminos distintos sobre la misma pérdida?
opening_hook: En un valle estrecho, avanzar siempre en la pendiente inmediata produce zigzag; momento y adaptación cambian la trayectoria.
class_practice: Superponer trayectorias de SGD, Momentum y Adam y relacionarlas con la programación de la tasa.
visual_evidence:
  title: Tres caminos sobre el mismo paisaje
  asset: assets/class-map.svg
  steps:
  - Pendiente local
  - Memoria o adaptación
  - Trayectoria de convergencia
common_misconception: Adam no es universalmente mejor; puede converger rápido y aun así generalizar peor que SGD.
