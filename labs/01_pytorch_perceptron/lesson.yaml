schema_version: '3.0'
title: Perceptrón con PyTorch
level: fundamentos
estimated_hours: 4
prerequisites:
- Python básico
- NumPy
- álgebra lineal elemental
learning_outcomes:
- Aprender tensores, autograd, optimizadores y un clasificador lineal.
- Preparar y auditar el dataset real banknote_authentication sin fuga de datos.
- Entrenar y evaluar clasificador lineal con autograd.
- 'Comparar contra la línea base: Regresión logística.'
- Interpretar intervalos de confianza, errores y limitaciones.
deliverables:
- notebook ejecutado
- reporte experimental
- model card
- comparación con línea base
- respuesta a preguntas críticas
success_criteria:
- cero solapamiento entre train, validation y test
- selección basada únicamente en validation
- métricas finales acompañadas por incertidumbre
- conclusiones que distinguen evidencia de suposición
dataset:
  name: banknote_authentication
  source: UCI
  reference: https://archive.ics.uci.edu/dataset/267/banknote+authentication
  license: Consultar ficha UCI
id: 01_pytorch_perceptron
class_number: 2
module_number: 1
module_title: Fundamentos
essential_question: ¿Qué calcula PyTorch por nosotros cuando llamamos a backward()?
opening_hook: La misma neurona de la clase anterior reaparece, pero ahora PyTorch dibuja y recorre automáticamente el grafo de operaciones.
class_practice: Inspeccionar tensores y gradientes, comparar el cálculo manual con autograd y visualizar la frontera antes y después de normalizar.
visual_evidence:
  title: El camino que sigue autograd
  asset: assets/class-map.svg
  steps:
  - Tensor y operaciones
  - Grafo computacional
  - Gradientes acumulados
common_misconception: backward() no actualiza los pesos; calcula gradientes. El optimizador realiza la actualización en un paso separado.
