lab: 08_gan_generation
title: GAN generativa
task: generation
architecture: dcgan
dataset: fashion_mnist
split_seed: 42
training_seed: 42
seed: 42
device: auto
epochs: 20
batch_size: 64
learning_rate: 0.001
patience: 5
quick:
  max_train_samples: 1024
  max_validation_samples: 256
  max_test_samples: 256
  epochs: 2
selection_metric: f1
test_policy: evaluate_once_after_model_selection
baseline: PCA generativa y distribución real de referencia
metrics:
- generator_loss
- discriminator_loss
- mmd_rbf
- diversity
- nearest_real_distance
- moment_distance
amp: false
compile: false
num_workers: 0
gradient_clip_norm: 5.0
deterministic: true
tracking: json
reporting:
  bootstrap_samples: 500
  subgroup_analysis: true
  profile_inference: true
