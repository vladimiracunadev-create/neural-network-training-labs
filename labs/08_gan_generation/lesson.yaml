schema_version: '3.0'
title: GAN generativa
level: avanzado
estimated_hours: 8
prerequisites:
- PyTorch intermedio
- optimización
- lectura de artículos técnicos
learning_outcomes:
- Generar prendas a partir de imágenes reales de Fashion-MNIST.
- Preparar y auditar el dataset real fashion_mnist sin fuga de datos.
- Entrenar y evaluar aprendizaje adversarial generativo.
- 'Comparar contra la línea base: PCA generativa y distribución real de referencia.'
- Interpretar intervalos de confianza, errores y limitaciones.
deliverables:
- notebook ejecutado
- reporte experimental
- model card
- comparación con línea base
- respuesta a preguntas críticas
success_criteria:
- cero solapamiento entre train, validation y test
- selección basada únicamente en validation
- métricas finales acompañadas por incertidumbre
- conclusiones que distinguen evidencia de suposición
dataset:
  name: fashion_mnist
  source: Torchvision / Zalando Research
  reference: https://github.com/zalandoresearch/fashion-mnist
  license: MIT
id: 08_gan_generation
class_number: 9
module_number: 3
module_title: Familias especializadas
essential_question: ¿Cómo sabemos si un generador aprendió diversidad y no solo unas pocas imágenes convincentes?
opening_hook: Una muestra bonita puede ocultar que el generador repite siempre la misma prenda. La evidencia está en la colección, no en la mejor imagen.
class_practice: Recorrer el espacio latente, comparar vecinos y medir diversidad junto con la estabilidad adversarial.
visual_evidence:
  title: El juego entre generar y distinguir
  asset: assets/class-map.svg
  steps:
  - Ruido latente
  - Imagen candidata
  - Crítica y ajuste
common_misconception: Una pérdida baja del generador no garantiza calidad ni cobertura de todos los modos de los datos.
