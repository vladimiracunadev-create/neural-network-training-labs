schema_version: '3.0'
title: MLP multiclase
level: fundamentos
estimated_hours: 4
prerequisites:
- Python básico
- NumPy
- álgebra lineal elemental
learning_outcomes:
- Resolver clasificación no lineal con capas densas, activaciones y regularización.
- Preparar y auditar el dataset real dry_bean sin fuga de datos.
- Entrenar y evaluar red multicapa para relaciones no lineales.
- 'Comparar contra la línea base: Regresión logística multinomial y Random Forest.'
- Interpretar intervalos de confianza, errores y limitaciones.
deliverables:
- notebook ejecutado
- reporte experimental
- model card
- comparación con línea base
- respuesta a preguntas críticas
success_criteria:
- cero solapamiento entre train, validation y test
- selección basada únicamente en validation
- métricas finales acompañadas por incertidumbre
- conclusiones que distinguen evidencia de suposición
dataset:
  name: dry_bean
  source: UCI
  reference: https://archive.ics.uci.edu/dataset/602/dry+bean+dataset
  license: CC BY 4.0
id: 02_mlp_nonlinear
class_number: 3
module_number: 1
module_title: Fundamentos
essential_question: ¿Qué puede aprender una capa oculta que una recta nunca podrá separar?
opening_hook: Dos clases pueden estar entrelazadas de manera que ninguna línea las divida. Las neuronas ocultas transforman primero el espacio para volver separable el problema.
class_practice: Comparar una frontera lineal con una MLP y relacionar las activaciones ocultas con las regiones de decisión.
visual_evidence:
  title: Cómo una MLP dobla el espacio
  asset: assets/class-map.svg
  steps:
  - Datos no separables
  - Transformación oculta
  - Regiones de decisión
common_misconception: Más capas no garantizan una mejor solución; añaden capacidad, costo y nuevas formas de sobreajustar.
