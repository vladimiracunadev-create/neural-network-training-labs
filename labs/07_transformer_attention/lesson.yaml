schema_version: '3.0'
title: Transformer para noticias
level: avanzado
estimated_hours: 8
prerequisites:
- PyTorch intermedio
- optimización
- lectura de artículos técnicos
learning_outcomes:
- Aplicar atención multi-cabeza a clasificación de noticias reales.
- Preparar y auditar el dataset real ag_news sin fuga de datos.
- Entrenar y evaluar autoatención para clasificación de texto.
- 'Comparar contra la línea base: TF-IDF + regresión logística.'
- Interpretar intervalos de confianza, errores y limitaciones.
deliverables:
- notebook ejecutado
- reporte experimental
- model card
- comparación con línea base
- respuesta a preguntas críticas
success_criteria:
- cero solapamiento entre train, validation y test
- selección basada únicamente en validation
- métricas finales acompañadas por incertidumbre
- conclusiones que distinguen evidencia de suposición
dataset:
  name: ag_news
  source: Hugging Face
  reference: https://huggingface.co/datasets/fancyzhx/ag_news
  license: Consultar dataset card
id: 07_transformer_attention
class_number: 8
module_number: 2
module_title: Arquitecturas
essential_question: ¿Cómo decide cada palabra a qué otras palabras prestar atención?
opening_hook: En una noticia, una palabra cambia de significado según las palabras que la rodean. La atención construye ese contexto de forma directa.
class_practice: Calcular atención escalada, aplicar máscaras y contrastar mapas de atención con cambios reales en la predicción.
visual_evidence:
  title: Preguntar, comparar y combinar contexto
  asset: assets/class-map.svg
  steps:
  - Query y keys
  - Pesos de atención
  - Contexto combinado
common_misconception: Un mapa de atención atractivo no es por sí solo una explicación causal de la predicción.
