schema_version: '3.0'
title: Explicabilidad
level: avanzado
estimated_hours: 8
prerequisites:
- PyTorch intermedio
- optimización
- lectura de artículos técnicos
learning_outcomes:
- Explicar predicciones con Integrated Gradients y permutación.
- Preparar y auditar el dataset real adult_census sin fuga de datos.
- Entrenar y evaluar atribución de características.
- 'Comparar contra la línea base: Regresión logística interpretable.'
- Interpretar intervalos de confianza, errores y limitaciones.
deliverables:
- notebook ejecutado
- reporte experimental
- model card
- comparación con línea base
- respuesta a preguntas críticas
success_criteria:
- cero solapamiento entre train, validation y test
- selección basada únicamente en validation
- métricas finales acompañadas por incertidumbre
- conclusiones que distinguen evidencia de suposición
dataset:
  name: adult_census
  source: UCI
  reference: https://archive.ics.uci.edu/dataset/2/adult
  license: CC BY 4.0
id: 21_explainability
class_number: 22
module_number: 6
module_title: Confianza y despliegue
essential_question: ¿Una explicación describe al modelo o solo produce una historia plausible?
opening_hook: Resaltar una variable importante parece convincente hasta que una pequeña perturbación cambia por completo el mapa.
class_practice: Comparar atribuciones locales y globales, perturbar entradas y medir estabilidad de la explicación.
visual_evidence:
  title: De la predicción a una evidencia contrastable
  asset: assets/class-map.svg
  steps:
  - Predicción concreta
  - Atribución estimada
  - Prueba de estabilidad
common_misconception: Una atribución alta no demuestra causalidad ni convierte una asociación del modelo en una razón del mundo real.
