schema_version: '3.0'
title: Regularización
level: intermedio
estimated_hours: 6
prerequisites:
- PyTorch básico
- particiones train/validation/test
- métricas de evaluación
learning_outcomes:
- Medir dropout, weight decay y batch normalization.
- Preparar y auditar el dataset real fashion_mnist sin fuga de datos.
- Entrenar y evaluar dropout, batch normalization y weight decay.
- 'Comparar contra la línea base: MLP sin regularización.'
- Interpretar intervalos de confianza, errores y limitaciones.
deliverables:
- notebook ejecutado
- reporte experimental
- model card
- comparación con línea base
- respuesta a preguntas críticas
success_criteria:
- cero solapamiento entre train, validation y test
- selección basada únicamente en validation
- métricas finales acompañadas por incertidumbre
- conclusiones que distinguen evidencia de suposición
dataset:
  name: fashion_mnist
  source: Torchvision / Zalando Research
  reference: https://github.com/zalandoresearch/fashion-mnist
  license: MIT
id: 19_regularization_dropout_batchnorm
class_number: 20
module_number: 5
module_title: Mecánica fina
essential_question: ¿Cómo distinguir una red que aprendió una regla de otra que memorizó ejemplos?
opening_hook: El entrenamiento puede seguir mejorando mientras validation empeora. Esa separación visible es la firma del sobreajuste.
class_practice: Comparar curvas train–validation, activar regularizadores por separado y medir estabilidad entre semillas.
visual_evidence:
  title: Capacidad, ajuste y generalización
  asset: assets/class-map.svg
  steps:
  - Modelo flexible
  - Brecha de generalización
  - Restricción útil
common_misconception: Dropout y batch normalization no son equivalentes ni deben activarse de la misma manera durante inferencia.
