schema_version: '3.0'
title: CNN para visión
level: intermedio
estimated_hours: 6
prerequisites:
- PyTorch básico
- particiones train/validation/test
- métricas de evaluación
learning_outcomes:
- Entrenar una CNN y analizar errores sobre fotografías reales de diez clases.
- Preparar y auditar el dataset real cifar10 sin fuga de datos.
- Entrenar y evaluar convoluciones para patrones espaciales.
- 'Comparar contra la línea base: Clasificador lineal sobre píxeles.'
- Interpretar intervalos de confianza, errores y limitaciones.
deliverables:
- notebook ejecutado
- reporte experimental
- model card
- comparación con línea base
- respuesta a preguntas críticas
success_criteria:
- cero solapamiento entre train, validation y test
- selección basada únicamente en validation
- métricas finales acompañadas por incertidumbre
- conclusiones que distinguen evidencia de suposición
dataset:
  name: cifar10
  source: Torchvision / University of Toronto
  reference: https://www.cs.toronto.edu/~kriz/cifar.html
  license: Consultar términos CIFAR-10
id: 03_cnn_vision
class_number: 4
module_number: 2
module_title: Arquitecturas
essential_question: ¿Por qué una convolución reconoce un patrón aunque cambie de posición?
opening_hook: Un borde sigue siendo un borde en cualquier zona de una fotografía. Una CNN reutiliza el mismo detector en toda la imagen.
class_practice: Mirar filtros y mapas de activación, calcular el campo receptivo y estudiar errores por clase en CIFAR-10.
visual_evidence:
  title: De píxeles a rasgos visuales
  asset: assets/class-map.svg
  steps:
  - Parche local
  - Filtro compartido
  - Mapa de activación
common_misconception: Una activación intensa no demuestra que la red haya comprendido un objeto; solo muestra respuesta a un patrón aprendido.
