schema_version: '3.0'
title: Aprendizaje federado por participante
level: avanzado
estimated_hours: 8
prerequisites:
- PyTorch intermedio
- optimización
- lectura de artículos técnicos
learning_outcomes:
- Aplicar FedAvg usando participantes reales como clientes naturales.
- Preparar y auditar el dataset real uci_har_subjects sin fuga de datos.
- Entrenar y evaluar agregación federada de clientes reales.
- 'Comparar contra la línea base: Entrenamiento centralizado.'
- Interpretar intervalos de confianza, errores y limitaciones.
deliverables:
- notebook ejecutado
- reporte experimental
- model card
- comparación con línea base
- respuesta a preguntas críticas
success_criteria:
- cero solapamiento entre train, validation y test
- selección basada únicamente en validation
- métricas finales acompañadas por incertidumbre
- conclusiones que distinguen evidencia de suposición
dataset:
  name: uci_har_subjects
  source: UCI
  reference: https://archive.ics.uci.edu/dataset/240/human+activity+recognition+using+smartphones
  license: CC BY 4.0
id: 15_federated_learning
class_number: 16
module_number: 4
module_title: Entrenamiento eficiente
essential_question: ¿Qué ocurre cuando cada participante observa una realidad diferente?
opening_hook: 'Los teléfonos no generan muestras idénticas: cada persona se mueve de otra manera. FedAvg debe combinar aprendizajes sin centralizar esos datos.'
class_practice: Visualizar heterogeneidad por cliente y comparar convergencia global con desempeño individual.
visual_evidence:
  title: Aprender localmente y acordar globalmente
  asset: assets/class-map.svg
  steps:
  - Clientes heterogéneos
  - Actualizaciones locales
  - Agregación global
common_misconception: No mover los datos no garantiza privacidad; las actualizaciones también pueden revelar información.
