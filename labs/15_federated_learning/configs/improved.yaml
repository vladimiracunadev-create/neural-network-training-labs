lab: 15_federated_learning
title: Aprendizaje federado por participante
task: multiclass_classification
architecture: fedavg_mlp
dataset: uci_har_subjects
split_seed: 42
training_seed: 42
seed: 42
device: auto
epochs: 50
batch_size: 64
learning_rate: 0.0005
patience: 8
quick:
  max_train_samples: 1024
  max_validation_samples: 256
  max_test_samples: 256
  epochs: 2
selection_metric: macro_f1
test_policy: evaluate_once_after_model_selection
baseline: Entrenamiento centralizado
metrics:
- accuracy
- macro_f1
- client_accuracy_std
amp: true
compile: false
num_workers: 2
gradient_clip_norm: 5.0
deterministic: true
tracking: json
reporting:
  bootstrap_samples: 500
  subgroup_analysis: true
  profile_inference: true
notes: Configuración ampliada; revisar recursos antes de ejecutarla.
