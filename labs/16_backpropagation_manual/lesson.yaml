schema_version: '3.0'
title: Backpropagation manual
level: fundamentos
estimated_hours: 4
prerequisites:
- Python básico
- NumPy
- álgebra lineal elemental
learning_outcomes:
- Derivar y programar backpropagation en una MLP pequeña.
- Preparar y auditar el dataset real iris sin fuga de datos.
- Entrenar y evaluar backpropagation manual.
- 'Comparar contra la línea base: Regresión logística multinomial.'
- Interpretar intervalos de confianza, errores y limitaciones.
deliverables:
- notebook ejecutado
- reporte experimental
- model card
- comparación con línea base
- respuesta a preguntas críticas
success_criteria:
- cero solapamiento entre train, validation y test
- selección basada únicamente en validation
- métricas finales acompañadas por incertidumbre
- conclusiones que distinguen evidencia de suposición
dataset:
  name: iris
  source: UCI
  reference: https://archive.ics.uci.edu/dataset/53/iris
  license: CC BY 4.0
id: 16_backpropagation_manual
class_number: 17
module_number: 5
module_title: Mecánica fina
essential_question: ¿Cómo se reparte la responsabilidad del error entre todas las capas?
opening_hook: La salida conoce el error, pero las primeras capas están lejos de él. La regla de la cadena transporta esa señal hacia atrás.
class_practice: Derivar una MLP capa por capa, comprobar el gradiente y graficar su norma a distintas profundidades.
visual_evidence:
  title: La responsabilidad viaja hacia atrás
  asset: assets/class-map.svg
  steps:
  - Error de salida
  - Regla de la cadena
  - Gradiente por parámetro
common_misconception: Un programa que ejecuta backward sin error puede seguir teniendo gradientes matemáticamente incorrectos.
