schema_version: '3.0'
title: Fusión de sensores
level: avanzado
estimated_hours: 8
prerequisites:
- PyTorch intermedio
- optimización
- lectura de artículos técnicos
learning_outcomes:
- Fusionar acelerómetro y giroscopio de smartphones para reconocer actividades.
- Preparar y auditar el dataset real uci_har sin fuga de datos.
- Entrenar y evaluar fusión de ramas de sensores.
- 'Comparar contra la línea base: Acelerómetro solo, giroscopio solo y regresión logística.'
- Interpretar intervalos de confianza, errores y limitaciones.
deliverables:
- notebook ejecutado
- reporte experimental
- model card
- comparación con línea base
- respuesta a preguntas críticas
success_criteria:
- cero solapamiento entre train, validation y test
- selección basada únicamente en validation
- métricas finales acompañadas por incertidumbre
- conclusiones que distinguen evidencia de suposición
dataset:
  name: uci_har
  source: UCI
  reference: https://archive.ics.uci.edu/dataset/240/human+activity+recognition+using+smartphones
  license: CC BY 4.0
id: 12_multimodal_fusion
class_number: 13
module_number: 3
module_title: Familias especializadas
essential_question: ¿Las modalidades se complementan o una de ellas domina silenciosamente?
opening_hook: Acelerómetro y giroscopio observan el mismo movimiento desde perspectivas distintas; perder uno revela cuánto dependía el modelo de cada sensor.
class_practice: Comparar cada modalidad, fusión temprana y tardía, y simular la ausencia de un sensor.
visual_evidence:
  title: Dos señales, una decisión
  asset: assets/class-map.svg
  steps:
  - Modalidades separadas
  - Representaciones alineadas
  - Predicción fusionada
common_misconception: Concatenar señales no garantiza fusión útil; el modelo puede ignorar una modalidad por completo.
