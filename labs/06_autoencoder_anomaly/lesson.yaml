schema_version: '3.0'
title: Autoencoder para fraude
level: intermedio
estimated_hours: 6
prerequisites:
- PyTorch básico
- particiones train/validation/test
- métricas de evaluación
learning_outcomes:
- Detectar transacciones fraudulentas mediante error de reconstrucción.
- Preparar y auditar el dataset real credit_card_fraud sin fuga de datos.
- Entrenar y evaluar reconstrucción para detección de anomalías.
- 'Comparar contra la línea base: Isolation Forest.'
- Interpretar intervalos de confianza, errores y limitaciones.
deliverables:
- notebook ejecutado
- reporte experimental
- model card
- comparación con línea base
- respuesta a preguntas críticas
success_criteria:
- cero solapamiento entre train, validation y test
- selección basada únicamente en validation
- métricas finales acompañadas por incertidumbre
- conclusiones que distinguen evidencia de suposición
dataset:
  name: credit_card_fraud
  source: Kaggle / ULB
  reference: https://www.kaggle.com/datasets/mlg-ulb/creditcardfraud
  license: Uso sujeto a términos de Kaggle y autor
id: 06_autoencoder_anomaly
class_number: 7
module_number: 2
module_title: Arquitecturas
essential_question: ¿Cuándo un error de reconstrucción se convierte en evidencia de anomalía?
opening_hook: Si el modelo aprende solamente el aspecto de las transacciones normales, las operaciones extrañas deberían resultarle difíciles de reconstruir.
class_practice: Comparar reconstrucciones, estudiar las distribuciones de error y elegir el umbral únicamente con validation.
visual_evidence:
  title: Del patrón normal al umbral de alerta
  asset: assets/class-map.svg
  steps:
  - Comprimir lo normal
  - Reconstruir
  - Separar por error
common_misconception: Un error alto no prueba fraude; señala una observación distinta de las aprendidas y necesita interpretación contextual.
