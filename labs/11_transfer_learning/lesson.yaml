schema_version: '3.0'
title: Transfer learning con mascotas
level: avanzado
estimated_hours: 8
prerequisites:
- PyTorch intermedio
- optimización
- lectura de artículos técnicos
learning_outcomes:
- Comparar extracción de características, fine-tuning y entrenamiento desde cero.
- Preparar y auditar el dataset real oxford_iiit_pet sin fuga de datos.
- Entrenar y evaluar reutilización de representaciones preentrenadas.
- 'Comparar contra la línea base: CNN pequeña entrenada desde cero.'
- Interpretar intervalos de confianza, errores y limitaciones.
deliverables:
- notebook ejecutado
- reporte experimental
- model card
- comparación con línea base
- respuesta a preguntas críticas
success_criteria:
- cero solapamiento entre train, validation y test
- selección basada únicamente en validation
- métricas finales acompañadas por incertidumbre
- conclusiones que distinguen evidencia de suposición
dataset:
  name: oxford_iiit_pet
  source: Torchvision / Oxford
  reference: https://www.robots.ox.ac.uk/~vgg/data/pets/
  license: Uso académico según fuente
id: 11_transfer_learning
class_number: 12
module_number: 3
module_title: Familias especializadas
essential_question: ¿Cuándo conviene reutilizar representaciones y cuándo hay que volver a aprenderlas?
opening_hook: Un modelo que ya reconoce bordes, texturas y formas no parte de cero al ver mascotas, pero sus rasgos tampoco son perfectos para la nueva tarea.
class_practice: Comparar extracción de características, fine-tuning y entrenamiento desde cero con igual presupuesto.
visual_evidence:
  title: Qué se conserva y qué se adapta
  asset: assets/class-map.svg
  steps:
  - Rasgos preentrenados
  - Capas congeladas
  - Ajuste al nuevo dominio
common_misconception: Fine-tuning no siempre gana; con pocos datos o una tasa alta puede destruir representaciones útiles.
